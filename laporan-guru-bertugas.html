<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laporan Guru Bertugas — SM Arab (Jaim) Al-Asyraf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030b12">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1JFlMpX8nCN4ZKW9SRiNdtFT-UC8D3nlN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="bg-fx"></div>
<div class="wrap">

  <div id="login-screen" class="hidden">
    <img class="logo-plain school-logo-img" alt="Logo Sekolah">
    <div class="brand-title">SM ARAB (JAIM) AL-ASYRAF</div>
    <div class="brand-sub">Sistem Pengurusan Sekolah</div>
    <div class="glass">
      <div class="gsi-wrap" id="google-btn-container"></div>
      <div class="divider">Atau</div>
      <form id="login-form">
        <label class="field-label" for="login-email">Emel Rasmi</label>
        <input class="field-input" type="email" id="login-email" placeholder="nama@moe-dl.edu.my" autocomplete="email" required>
        <button class="btn-primary" type="submit" id="login-btn">Log Masuk</button>
        <div class="error-text hidden" id="login-error"></div>
      </form>
    </div>
  </div>

  <div id="app-content" class="hidden">

    <div class="site-header-wrap">
      <header class="site-header">
        <div class="site-header-row1">
          <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="Buka menu"><span data-icon="menu"></span></button>
          <img class="header-logo school-logo-img" alt="Logo Sekolah">
          <div class="header-title-block">
            <div class="header-school-name">SM ARAB (JAIM) AL-ASYRAF</div>
            <div class="header-school-sub">Laporan Guru Bertugas</div>
          </div>
        </div>
        <div class="site-header-row2">
          <span class="header-greet">Selamat Datang, <span id="header-greet-name">-</span></span>
          <span class="header-status"><span class="status-dot"></span>Sistem Aktif <span id="live-clock">--:--:-- --</span></span>
        </div>
      </header>
    </div>

    <div class="lgb-scope">

    <div class="tab-switch">
      <button class="tab-btn active" id="lgb-nav-borang" onclick="lgbSwitchTab('borang')">Isi Laporan</button>
      <button class="tab-btn" id="lgb-nav-senarai" onclick="lgbSwitchTab('senarai')">Senarai Laporan</button>
    </div>

    <!-- ============ Tab: Borang (3 skrin dalam satu panel) ============ -->
    <div id="lgb-panel-borang">

      <!-- Skrin 1: Mula -->
      <div id="lgb-screen-start">
        <div class="section-title">Mulakan Laporan</div>
        <div class="glass card-pad">
          <label class="field-label">Minggu</label>
          <input class="field-input" type="text" id="lgb-start-minggu" placeholder="Cth: Minggu 3">
          <label class="field-label">Tarikh</label>
          <input class="field-input" type="date" id="lgb-start-tarikh">
          <label class="field-label">Nama Pelapor</label>
          <input class="field-input" type="text" id="lgb-start-pelapor">
          <label class="field-label">Nama-Nama Guru Bertugas</label>
          <textarea class="field-input" id="lgb-start-guru" rows="2"></textarea>
          <div class="error-text hidden" id="lgb-start-error"></div>
          <button class="btn-bw-solid" id="lgb-start-btn" onclick="lgbStartOrResume()">Simpan & Mula</button>
        </div>
      </div>

      <!-- Skrin 2: Pemilih Seksyen -->
      <div id="lgb-screen-picker" class="hidden">
        <div class="section-title">Pilih Seksyen</div>
        <div class="sub-dim" id="lgb-picker-subtitle" style="margin-bottom:14px">-</div>
        <div id="lgb-picker-list"></div>
        <button class="btn-bw-outline" onclick="lgbBackToStart()" style="margin-top:14px">&larr; Laporan Lain / Tukar Tarikh</button>
      </div>

      <!-- Skrin 3: Borang satu seksyen -->
      <div id="lgb-screen-section" class="hidden">
        <div class="section-title" id="lgb-section-title">-</div>
        <div class="glass card-pad">
          <div id="lgb-section-fields"></div>
          <div class="error-text hidden" id="lgb-section-error"></div>
        </div>
        <div class="lgb-section-btn-row">
          <button class="btn-bw-outline" onclick="lgbCancelSection()">Batal</button>
          <button class="btn-bw-solid" id="lgb-section-save-btn" onclick="lgbSaveCurrentSection()">Simpan Seksyen</button>
        </div>
      </div>

    </div>

    <!-- ============ Tab: Senarai Laporan ============ -->
    <div id="lgb-panel-senarai" class="hidden">
      <div id="lgb-senarai-list"><div class="empty-state">Memuatkan...</div></div>
    </div>

    </div>

  </div>

</div>

<!-- ============ Popup: Lihat laporan penuh ============ -->
<div class="lgb-view-overlay hidden" id="lgb-view-overlay">
  <div class="lgb-view-sheet">
    <div class="lgb-view-header">
      <div class="lgb-view-title" id="lgb-view-title">-</div>
      <button class="lgb-view-close" onclick="lgbCloseReport()">✕</button>
    </div>
    <div id="lgb-view-body"></div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-logo-row"><img class="school-logo-img" alt=""><span>SMASRA</span></div>
  <a class="drawer-item" href="index.html"><span data-icon="home"></span><span class="drawer-label">Laman Utama</span></a>
  <div id="drawer-menu-body"></div>
  <div class="drawer-spacer"></div>
  <a class="drawer-item drawer-logout" href="#" onclick="logout();return false;"><span data-icon="power"></span><span class="drawer-label">Log Keluar</span></a>
</nav>

<div class="bottom-nav-wrap">
  <nav class="bottom-nav">
    <a class="bn-item" href="kehadiran-staf.html?open=kehadiran" aria-label="Kehadiran"><span data-icon="calendar"></span><span class="bn-label">Kehadiran</span></a>
    <a class="bn-item" href="event.html" aria-label="Event"><span data-icon="event"></span><span class="bn-label">Event</span></a>
    <a class="bn-item" href="index.html" aria-label="Home"><span data-icon="home"></span><span class="bn-label">Home</span></a>
    <a class="bn-item" href="laporan-pentadbir.html" aria-label="Laporan"><span data-icon="clipboard"></span><span class="bn-label">Laporan</span></a>
    <a class="bn-item" href="profile.html" aria-label="Profil"><span data-icon="profile"></span><span class="bn-label">Profil</span></a>
  </nav>
</div>

<script src="app.js"></script>
<script src="laporan-guru-bertugas.js"></script>
<script>
  initApp(lgbInit);
</script>
</body>
</html>
