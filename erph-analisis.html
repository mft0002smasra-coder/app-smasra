<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analisis e-RPH — SM Arab (Jaim) Al-Asyraf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050810">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1JFlMpX8nCN4ZKW9SRiNdtFT-UC8D3nlN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="bg-fx"></div>
<div class="wrap">

  <div id="login-screen" class="hidden">
    <img class="logo-plain school-logo-img" alt="Logo Sekolah">
    <div class="brand-title">SM ARAB (JAIM) AL-ASYRAF</div>
    <div class="brand-sub">Sistem Pengurusan Sekolah</div>
    <div class="glass">
      <div class="gsi-wrap" id="google-btn-container"></div>
      <div class="divider">Atau</div>
      <form id="login-form">
        <label class="field-label" for="login-email">Emel Rasmi</label>
        <input class="field-input" type="email" id="login-email" placeholder="nama@moe-dl.edu.my" autocomplete="email" required>
        <button class="btn-primary" type="submit" id="login-btn">Log Masuk</button>
        <div class="error-text hidden" id="login-error"></div>
      </form>
    </div>
  </div>

  <div id="app-content" class="hidden">

    <div class="site-header-wrap">
      <header class="site-header">
        <div class="site-header-row1">
          <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="Buka menu"><span data-icon="menu"></span></button>
          <img class="header-logo school-logo-img" alt="Logo Sekolah">
          <div class="header-title-block">
            <div class="header-school-name">SM ARAB (JAIM) AL-ASYRAF</div>
            <div class="header-school-sub">Analisis e-RPH</div>
          </div>
        </div>
        <div class="site-header-row2">
          <span class="header-greet">Selamat Datang, <span id="header-greet-name">-</span></span>
          <span class="header-status"><span class="status-dot"></span>Sistem Aktif <span id="live-clock">--:--:-- --</span></span>
        </div>
      </header>
    </div>

    <div class="tab-switch">
      <button class="tab-btn active" id="er-nav-hantar" onclick="erSwitchTab('hantar')">Penghantaran</button>
      <button class="tab-btn" id="er-nav-saya" onclick="erSwitchTab('saya')">Prestasi Saya</button>
      <button class="tab-btn hidden" id="er-nav-semak" onclick="erSwitchTab('semak')">Semakan Saya</button>
    </div>

    <div class="er-filters">
      <select class="er-select" id="er-f-tahun" onchange="erOnFilter('tahun')"></select>
      <select class="er-select" id="er-f-bulan" onchange="erOnFilter('bulan')"></select>
      <select class="er-select" id="er-f-minggu" onchange="erOnFilter('minggu')"></select>
    </div>

    <div class="error-text hidden" id="er-banner"></div>
    <div id="er-content"><div class="empty-state">Memuatkan data e-RPH...</div></div>

  </div>

</div>

<!-- ============ Popup senarai (klik kad analisis) ============ -->
<div class="er-popup-overlay hidden" id="er-popup-overlay" onclick="if(event.target===this)erClosePopup()">
  <div class="er-popup-card">
    <div class="er-popup-head">
      <div class="er-popup-title" id="er-popup-title">-</div>
      <button class="er-popup-close" onclick="erClosePopup()">✕</button>
    </div>
    <div class="er-popup-sub" id="er-popup-sub"></div>
    <div id="er-popup-body"></div>
  </div>
</div>

<div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-logo-row"><img class="school-logo-img" alt=""><span>SMASRA</span></div>
  <a class="drawer-item" href="index.html"><span data-icon="home"></span><span class="drawer-label">Laman Utama</span></a>
  <div id="drawer-menu-body"></div>
  <div class="drawer-spacer"></div>
  <a class="drawer-item drawer-logout" href="#" onclick="logout();return false;"><span data-icon="power"></span><span class="drawer-label">Log Keluar</span></a>
</nav>

<div class="bottom-nav-wrap">
  <nav class="bottom-nav">
    <a class="bn-item" href="kehadiran-staf.html?open=kehadiran" aria-label="Kehadiran"><span data-icon="calendar"></span><span class="bn-label">Kehadiran</span></a>
    <a class="bn-item" href="event.html" aria-label="Event"><span data-icon="event"></span><span class="bn-label">Event</span></a>
    <a class="bn-item" href="index.html" aria-label="Home"><span data-icon="home"></span><span class="bn-label">Home</span></a>
    <a class="bn-item" href="laporan-pentadbir.html" aria-label="Laporan"><span data-icon="clipboard"></span><span class="bn-label">Laporan</span></a>
    <a class="bn-item" href="profile.html" aria-label="Profil"><span data-icon="profile"></span><span class="bn-label">Profil</span></a>
  </nav>
</div>

<script src="app.js"></script>
<script src="erph-analisis.js"></script>
<script>
  initApp(erInit);
</script>
</body>
</html>
