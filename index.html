<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SM Arab (Jaim) Al-Asyraf</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#030b12">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1JFlMpX8nCN4ZKW9SRiNdtFT-UC8D3nlN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="bg-fx"></div>

<div class="wrap">

  <!-- ============ SKRIN LOG MASUK ============ -->
  <div id="login-screen" class="hidden">
    <img class="logo-plain school-logo-img" alt="Logo Sekolah">
    <div class="brand-title">SM ARAB (JAIM) AL-ASYRAF</div>
    <div class="brand-sub">Sistem Pengurusan Sekolah</div>

    <div class="glass">
      <div class="gsi-wrap" id="google-btn-container"></div>
      <div class="divider">Atau</div>
      <form id="login-form">
        <label class="field-label" for="login-email">Emel Rasmi</label>
        <input class="field-input" type="email" id="login-email" placeholder="nama@moe-dl.edu.my" autocomplete="email" required>
        <button class="btn-primary" type="submit" id="login-btn">Log Masuk</button>
        <div class="error-text hidden" id="login-error"></div>
      </form>
    </div>
  </div>

  <!-- ============ KANDUNGAN APP (selepas login) ============ -->
  <div id="app-content" class="hidden">

    <!-- Header sentiasa ada, tiada kotak/garis -->
    <header class="site-header">
      <div class="site-header-row1">
        <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="Buka menu"><span data-icon="menu"></span></button>
        <img class="header-logo school-logo-img" alt="Logo Sekolah">
        <div class="header-school-name">SM ARAB (JAIM) AL-ASYRAF</div>
      </div>
      <div class="site-header-row2">
        <span class="header-greet" id="header-greet">Hai, -</span>
        <img class="header-avatar user-avatar-img" alt="" onclick="location.href='profile.html'">
      </div>
    </header>

    <div class="banner-carousel" id="banner-carousel">
      <div class="banner-track" id="banner-track" onclick="expandBanner()">
        <div class="banner-empty">Memuatkan banner...</div>
      </div>
      <div class="banner-dots" id="banner-dots"></div>
    </div>

    <div class="section-label">Pengumuman</div>
    <div id="home-pengumuman-list">
      <div class="empty-state">Memuatkan pengumuman...</div>
    </div>

  </div>

  <!-- ============ DRAWER / SIDEBAR (ikon + teks) ============ -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <nav class="drawer" id="drawer">
    <div class="drawer-logo-row"><img class="school-logo-img" alt=""><span>SMASRA</span></div>
    <a class="drawer-item active" href="index.html"><span data-icon="home"></span><span class="drawer-label">Laman Utama</span></a>
    <a class="drawer-item" href="pengumuman.html"><span data-icon="announce"></span><span class="drawer-label">Pengumuman</span></a>
    <div class="drawer-item soon"><span data-icon="calendar"></span><span class="drawer-label">Kehadiran Staf</span></div>
    <div class="drawer-item soon"><span data-icon="calendar"></span><span class="drawer-label">Kehadiran Murid</span></div>
    <div class="drawer-item soon"><span data-icon="folder"></span><span class="drawer-label">Laporan Pentadbir</span></div>
    <div class="drawer-item soon"><span data-icon="folder"></span><span class="drawer-label">Laporan Guru</span></div>
    <div class="drawer-item soon"><span data-icon="chart"></span><span class="drawer-label">Prestasi Kerja</span></div>
    <div class="drawer-spacer"></div>
    <a class="drawer-item drawer-logout" href="#" onclick="logout();return false;"><span data-icon="power"></span><span class="drawer-label">Log Keluar</span></a>
  </nav>

  <!-- ============ BOTTOM NAV — Home di tengah, Profil hujung ============ -->
  <div class="bottom-nav-wrap">
    <nav class="bottom-nav">
      <span class="bn-item bn-placeholder" aria-hidden="true"></span>
      <span class="bn-item bn-placeholder" aria-hidden="true"></span>
      <a class="bn-item active" href="index.html" aria-label="Home"><span data-icon="home"></span></a>
      <span class="bn-item bn-placeholder" aria-hidden="true"></span>
      <a class="bn-item" href="profile.html" aria-label="Profil"><span data-icon="profile"></span></a>
    </nav>
  </div>

  <!-- ============ LIGHTBOX (klik banner untuk besarkan) ============ -->
  <div class="lightbox-overlay hidden" id="lightbox-overlay" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Banner diperbesar">
  </div>

</div>

<script src="app.js"></script>
<script>
  function renderHome(user) {
    loadBanner();
    loadPengumumanList("home-pengumuman-list");
  }
  initApp(renderHome);
</script>
</body>
</html>
